services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-campus_sync}
    # Deliberately no ports: the database is reachable only from the compose
    # network, as "postgres:5432". Publishing it would fight whatever already
    # owns 5432 on the host and expose the database to the network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-campus_sync}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Only the host side is configurable. The app always listens on 3000 inside
    # its own container, where nothing can collide with it.
    ports:
      - "${APP_PORT:-15000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-campus_sync}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      # Must match the URL people actually open, port included, or sign-in
      # redirects and verification links lead somewhere dead.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:15000}
      AUTH_TRUST_HOST: "true"
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-smtp.gmail.com}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@campussync.com}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      DISABLE_HOD_SIGNUP: ${DISABLE_HOD_SIGNUP:-false}
      DISABLE_FACULTY_SIGNUP: ${DISABLE_FACULTY_SIGNUP:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
